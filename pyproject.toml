[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redgreen"
version = "0.1.0"
description = "A test-first, reward-hack-resistant bug-fixing agent for Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["anthropic>=0.39", "pytest>=8.0"]

[project.optional-dependencies]
report = ["matplotlib>=3.7"]

[project.scripts]
redgreen-eval = "eval.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
